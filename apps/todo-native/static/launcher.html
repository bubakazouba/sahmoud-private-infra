<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apps</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0e1621; --card:#17212b; --card2:#1d2a37; --fg:#f5f7fa; --sub:#8b98a5;
    --accent:#3390ec; --border:#25313d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:14px;
  }
  h1{font-size:15px; font-weight:600; letter-spacing:.02em; color:var(--sub);
     text-transform:uppercase; margin:2px 2px 2px; }
  .grid{display:flex; flex-direction:column; gap:12px}
  a.card{
    display:flex; align-items:center; gap:15px; text-decoration:none; color:var(--fg);
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:17px 18px; transition:transform .06s ease, background .15s ease;
  }
  a.card:active{transform:scale(.985); background:var(--card2)}
  .ic{
    flex:0 0 46px; height:46px; border-radius:12px; display:grid; place-items:center;
    font-size:24px; background:var(--card2);
  }
  .tx{flex:1; min-width:0}
  .tt{font-size:17px; font-weight:600}
  .ds{font-size:13px; color:var(--sub); margin-top:2px}
  .ch{color:var(--sub); font-size:20px; flex:0 0 auto}
  .foot{margin-top:auto; text-align:center; color:var(--sub); font-size:12px; padding-top:10px}
</style>
</head>
<body>
  <h1>Apps</h1>
  <div class="grid" id="grid"></div>
  <div class="foot">PianoBot</div>
<script>
  var TODO_TOKEN = "aKuGNU4WiERVR6Acpp--Q1FycR0jXR4rdE0vT9JYn_0";
  var APPS = [
    {icon:"📋", title:"Todo", desc:"tasks, wishlist & lists",
     url:"https://solutionbanks.com:8000/?token="+TODO_TOKEN},
    {icon:"🧵", title:"Open Arcs", desc:"the golden set — live threads",
     url:"https://desktop-0rco3g7.tail0159f4.ts.net/app/amazon-dashboard/arc_review.html"},
    {icon:"🎧", title:"Audiobooks", desc:"synced reader — listen",
     url:"https://solutionbanks.com:9000/?token=XOcjZHXDEeC5y1YeOoe2zlYvbyr3OFA0pq0rL8OV0tY"},
    {icon:"📊", title:"Tokens", desc:"usage & session limits",
     url:"https://desktop-0rco3g7.tail0159f4.ts.net/app/tokens/limits"}
  ];
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
  function openApp(url){
    // openLink opens in the in-app browser (keeps the Telegram frame); fallback to nav.
    if (tg && tg.openLink){ tg.openLink(url, {try_instant_view:false}); }
    else { window.location.href = url; }
  }
  var grid = document.getElementById("grid");
  APPS.forEach(function(a){
    var el = document.createElement("a");
    el.className = "card"; el.href = a.url;
    el.innerHTML = '<div class="ic">'+a.icon+'</div>'+
      '<div class="tx"><div class="tt">'+a.title+'</div><div class="ds">'+a.desc+'</div></div>'+
      '<div class="ch">›</div>';
    el.addEventListener("click", function(ev){ ev.preventDefault(); openApp(a.url); });
    grid.appendChild(el);
  });
</script>
</body>
</html>
