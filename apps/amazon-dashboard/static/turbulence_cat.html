<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clear-Air Turbulence Trend</title>
<style>
  :root{--bg:#0f1419;--panel:#1a212b;--border:#2d3744;--text:#e6ecf3;--dim:#8b97a7;--old:#5fa8ff;--new:#ff9900;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
  .wrap{max-width:920px;margin:0 auto;padding:20px}
  h1{font-size:21px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  .row{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .rh .cat{font-size:15px;font-weight:600}
  .rh .chg{font-size:15px;font-weight:700;color:var(--new)}
  .bar{display:flex;align-items:center;gap:10px;margin:5px 0}
  .bar .lbl{width:62px;color:var(--dim);font-size:12px}
  .bar .track{flex:1;background:#11161d;border-radius:4px;height:24px;position:relative}
  .bar .fill{height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:600;color:#0f1419}
  .legend{color:var(--dim);font-size:12px;margin:6px 2px 16px}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 5px 0 14px;vertical-align:middle}
  .note{color:var(--dim);font-size:12px;line-height:1.55;margin-top:6px}
</style></head>
<body><div class="wrap">
  <h1>🌀 Clear-Air Turbulence is Rising (North Atlantic, 1979 → 2020)</h1>
  <div class="sub">Hours per year of clear-air turbulence at a representative North Atlantic point · Prosser et al. 2023, Geophysical Research Letters (ERA5 reanalysis, 42-year record)</div>
  <div class="legend"><span class="sw" style="background:#5fa8ff"></span>1979<span class="sw" style="background:#ff9900"></span>2020</div>
  <div id="rows"></div>
  <div class="note" id="note"></div>
</div>
<script>
// Prosser et al. 2023 — confirmed endpoint values (hours/year)
const CAT=[
 {cat:"Severe", v1979:17.7, v2020:27.4, chg:"+55%"},
 {cat:"Moderate+", v1979:70.0, v2020:96.1, chg:"+37%"},
 {cat:"Light+", v1979:466.5, v2020:546.8, chg:"+17%"},
];
document.getElementById("rows").innerHTML=CAT.map(c=>{
 const mx=c.v2020; // per-row scale so each rise is visible
 const w1=c.v1979/mx*100, w2=c.v2020/mx*100;
 return `<div class="row">
   <div class="rh"><span class="cat">${c.cat} CAT</span><span class="chg">${c.chg}</span></div>
   <div class="bar"><span class="lbl">1979</span><div class="track"><div class="fill" style="width:${w1}%;background:#5fa8ff">${c.v1979} hrs</div></div></div>
   <div class="bar"><span class="lbl">2020</span><div class="track"><div class="fill" style="width:${w2}%;background:#ff9900">${c.v2020} hrs</div></div></div>
 </div>`;
}).join("");
document.getElementById("note").innerHTML=
 "This is the genuine 'turbulence over the longest timeline' dataset, 42 years of atmospheric reanalysis. "+
 "Severe clear-air turbulence rose <b>+55%</b> over the world's busiest flight corridor. Mechanism: CO2 warming sharpens jet-stream wind shear -> more CAT. "+
 "Each row is scaled to its own 2020 value so the rise is visible (Light+ CAT is ~20x more total hours than Severe). "+
 "Note: this measures turbulence IN THE ATMOSPHERE, not a count of aircraft encounters, no clean public year-by-year aircraft-encounter series exists.";
</script></body></html>
