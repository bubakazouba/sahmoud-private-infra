<title>Arcs</title><style>
:root{--bg:#0e1116;--panel:#161a22;--panel2:#1c212c;--ink:#e9ecf3;--muted:#98a2b4;--line:#2a303c;--accent:#7aa2ff;--good:#5fd08a;--warn:#e6b45f;--mono:ui-monospace,Menlo,Consolas,monospace}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 70px}
h1{font-size:21px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h1 .c{font-size:12px;color:var(--muted);font-weight:400}
.searchbar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
#q{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px}
.filters{display:flex;gap:6px;margin-top:8px}
.filt{padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:12.5px;cursor:pointer}
.filt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.arc{border:1px solid var(--line);border-radius:11px;margin:7px 0;background:var(--panel);overflow:hidden}
.hd{padding:11px 13px;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.hd:hover{background:var(--panel2)}
.hd .chev{color:var(--accent);font-size:11px;margin-top:4px;transition:transform .15s;flex:none}
.arc.open .chev{transform:rotate(90deg)}
.hd .t{flex:1;font-size:14.5px;font-weight:600;line-height:1.35}
.tag{font-size:9.5px;border-radius:20px;padding:2px 8px;white-space:nowrap;flex:none;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.tag.st{background:#123a2a;color:var(--good);border:1px solid #245c39}
.tag.arch{background:#2a2f3a;color:var(--muted)}
.bd{display:none;padding:2px 13px 12px}
.arc.open .bd{display:block}
.bl{padding:6px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
.bl:first-child{border-top:0}
.bl b{color:var(--ink)} code{background:var(--panel2);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11.5px}
.bl a{color:var(--accent)} .bl i{color:var(--muted);font-style:normal;font-size:12px}
mark{background:var(--warn);color:#0b0d11;border-radius:3px;padding:0 2px}
.none{color:var(--muted);text-align:center;padding:30px;font-size:14px}
.date{color:var(--warn);font-family:var(--mono);font-size:11.5px}
