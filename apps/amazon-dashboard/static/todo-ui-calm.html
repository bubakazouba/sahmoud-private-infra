<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>To-Do · Calm</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#fff; --ink:#1c1c1e; --sub:#8a8a8e; --line:#ececea;
  --accent:#0a84ff; --sidebar:#fafaf8; --hover:#f0f0ee;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:268px;flex:0 0 268px;background:var(--sidebar);border-right:1px solid var(--line);
  overflow-y:auto;padding:18px 10px 40px}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);
  padding:6px 12px 14px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;cursor:pointer;
  color:var(--ink);user-select:none}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:#e6e6e3;font-weight:600}
.nav-item .ico{width:18px;text-align:center;opacity:.7}
.nav-item .cnt{margin-left:auto;color:var(--sub);font-size:12px;font-weight:500}
.nav-group{margin-top:8px}
.nav-sub{padding-left:30px;font-size:14px;color:#3a3a3c}
.nav-sub .ico{opacity:.45}
.main{flex:1;overflow-y:auto;padding:0}
.topbar{position:sticky;top:0;background:rgba(246,246,244,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;z-index:5}
.menu-btn{display:none;font-size:22px;background:none;border:none;cursor:pointer;color:var(--ink)}
.title{font-size:26px;font-weight:700}
.title .c{color:var(--sub);font-size:16px;font-weight:500;margin-left:8px}
.search{margin-left:auto;flex:0 0 240px}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;
  font-size:14px;outline:none}
.search input:focus{border-color:var(--accent)}
.content{padding:18px 28px 80px;max-width:820px;margin:0 auto}
.sec{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);
  margin:26px 4px 8px}
.row{display:flex;align-items:flex-start;gap:13px;background:var(--panel);border:1px solid var(--line);
  border-bottom:none;padding:13px 15px}
.row:first-of-type{border-radius:12px 12px 0 0}
.row:last-of-type{border-radius:0 0 12px 12px;border-bottom:1px solid var(--line)}
.row.solo{border-radius:12px;border-bottom:1px solid var(--line)}
.check{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1.6px solid #c7c7cc;margin-top:1px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.check.done{background:#16a34a;border-color:#16a34a;color:#fff;font-size:12px}
.row-body{flex:1;min-width:0}
.row-name{font-size:15px}
.row.done .row-name{color:var(--sub);text-decoration:line-through}
.row-desc{color:var(--sub);font-size:13px;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;color:#fff;line-height:1.6}
.dupbadge{font-size:10px;font-weight:700;letter-spacing:.04em;background:#9ca3af;color:#fff;
  padding:2px 7px;border-radius:5px;text-transform:uppercase}
.empty{color:var(--sub);text-align:center;padding:60px 20px}
.filtbar{display:flex;flex-wrap:wrap;gap:7px;margin:4px 4px 6px}
.fpill{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;background:#fff;border:1px solid var(--line);
  cursor:pointer;color:#444}
.fpill.on{color:#fff;border-color:transparent}
.scrim{display:none}
@media(max-width:760px){
  .sidebar{position:fixed;z-index:40;height:100%;left:0;top:0;transform:translateX(-105%);
    transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.18);width:280px}
  body.nav-open .sidebar{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
  body.nav-open .scrim{display:block}
  .menu-btn{display:block}
  .title{font-size:22px}.search{display:none}
  .content{padding:14px 14px 80px}.topbar{padding:12px 14px}
}
</style></head>

    </div>

      <div id="list"></div>
    </div>
  </main>
</div>

const FALLBACK="#94a3b8";
function tagColor(t){return TC[t]||FALLBACK;}
function isDone(it){return it.tags.indexOf("done")>=0;}
function topFolder(f){return f.split(" / ")[0];}
function subFolder(f){var p=f.split(" / ");return p.length>1?p[1]:null;}
// luminance -> pick readable text color
function txtOn(hex){var c=hex.replace('#','');var r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return (r*299+g*587+b*114)/1000>150?'#1a1a1a':'#fff';}

var state={folder:"__ALL__",tag:null};
function toggleNav(o){document.body.classList.toggle('nav-open',o);}
function counts(){var c={top:{},sub:{},all:DATA.length,done:0};
  DATA.forEach(function(it){var t=topFolder(it.folder),s=it.folder;
    c.top[t]=(c.top[t]||0)+1;c.sub[s]=(c.sub[s]||0)+1;if(isDone(it))c.done++;});return c;}
function buildNav(){
  var c=counts();var nav=document.getElementById('nav');var h='';
  function item(label,key,ico,active,cnt,sub){
    return '<div class="nav-item'+(sub?' nav-sub':'')+(active?' active':'')+'" onclick="pick(\''+key.replace(/'/g,"\\'")+'\')">'+
      '<span class="ico">'+ico+'</span><span>'+label+'</span><span class="cnt">'+cnt+'</span></div>';}
  h+=item('All','__ALL__','&#9737;',state.folder==='__ALL__',c.all,false);
  h+=item('Completed','__DONE__','&#10003;',state.folder==='__DONE__',c.done,false);
  // group by top folder
  var tops=Object.keys(c.top).sort();
  tops.forEach(function(top){
    h+='<div class="nav-group">';
    h+=item(top,'top:'+top,'&#128193;',state.folder==='top:'+top,c.top[top],false);
    Object.keys(c.sub).filter(function(s){return topFolder(s)===top && subFolder(s);}).sort().forEach(function(s){
      h+=item(subFolder(s),'sub:'+s,'&#8226;',state.folder==='sub:'+s,c.sub[s],true);});
    h+='</div>';});
  nav.innerHTML=h;
}
function pick(k){state.folder=k;state.tag=null;toggleNav(false);buildNav();render();}
function folderLabel(){if(state.folder==='__ALL__')return 'All';if(state.folder==='__DONE__')return 'Completed';
  if(state.folder.indexOf('sub:')===0)return subFolder(state.folder.slice(4));
  if(state.folder.indexOf('top:')===0)return state.folder.slice(4);return 'All';}
function match(it){
  if(state.folder==='__DONE__'){if(!isDone(it))return false;}
  else if(state.folder.indexOf('top:')===0){if(topFolder(it.folder)!==state.folder.slice(4))return false;}
  else if(state.folder.indexOf('sub:')===0){if(it.folder!==state.folder.slice(4))return false;}
  if(state.tag && it.tags.indexOf(state.tag)<0)return false;
  var q=document.getElementById('q').value.trim().toLowerCase();
  if(q && (it.name+' '+it.desc).toLowerCase().indexOf(q)<0)return false;
  return true;}
function buildTagFilter(){
  var present={};DATA.forEach(function(it){if(match(Object.assign({},it,{tags:it.tags}))||true){}});
  // collect tags from currently folder-matched (ignore tag filter) set
  var saved=state.tag;state.tag=null;var set={};
  DATA.forEach(function(it){if(match(it))it.tags.forEach(function(t){set[t]=1;});});state.tag=saved;
  var tags=Object.keys(set).sort();var el=document.getElementById('tagfilt');
  el.innerHTML=tags.map(function(t){var on=state.tag===t;var col=tagColor(t);
    return '<span class="fpill'+(on?' on':'')+'" style="'+(on?'background:'+col+';':'')+'" onclick="toggleTag(\''+t+'\')">#'+t+'</span>';}).join('');
}
function toggleTag(t){state.tag=state.tag===t?null:t;buildTagFilter();render();}
function render(){
  document.getElementById('title').innerHTML=folderLabel();
  buildTagFilter();
  var items=DATA.filter(match);
  var list=document.getElementById('list');
  if(!items.length){list.innerHTML='<div class="empty">Nothing here yet.</div>';return;}
  // group by subfolder for readability
  var groups={};items.forEach(function(it){(groups[it.folder]=groups[it.folder]||[]).push(it);});
  var keys=Object.keys(groups).sort();var h='';
  keys.forEach(function(k){
    h+='<div class="sec">'+k+'</div>';
    var g=groups[k];
    g.forEach(function(it,i){
      var solo=g.length===1;
      h+='<div class="row'+(isDone(it)?' done':'')+(solo?' solo':'')+'">';
      h+='<div class="check'+(isDone(it)?' done':'')+'">'+(isDone(it)?'&#10003;':'')+'</div>';
      h+='<div class="row-body"><div class="row-name">'+esc(it.name)+(it.dup?' <span class="dupbadge">dup</span>':'')+'</div>';
      if(it.desc)h+='<div class="row-desc">'+esc(it.desc)+'</div>';
      if(it.tags.length){h+='<div class="chips">'+it.tags.map(function(t){
        return '<span class="chip" style="background:'+tagColor(t)+'">'+t+'</span>';}).join('')+'</div>';}
      h+='</div></div>';
    });
  });
  list.innerHTML=h;
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
