<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla FSD Growth</title>
<style>
  :root{--bg:#0f1419;--panel:#1a212b;--border:#2d3744;--text:#e6ecf3;--dim:#8b97a7;--acc:#e82127;--acc2:#ff9900;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
  .wrap{max-width:900px;margin:0 auto;padding:20px}
  h1{font-size:21px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
  .card .n{font-size:23px;font-weight:700;color:var(--acc2)}
  .card .l{color:var(--dim);font-size:12px;margin-top:2px}
  h2{font-size:15px;margin:18px 0 10px;color:var(--dim);font-weight:600}
  .bars{display:flex;align-items:flex-end;gap:18px;height:230px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 16px 8px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar{width:70%;background:linear-gradient(180deg,var(--acc),#a01015);border-radius:4px 4px 0 0}
  .v{font-size:13px;font-weight:700;margin-bottom:4px}
  .x{font-size:11px;color:var(--dim);margin-top:6px;text-align:center}
  .note{color:var(--dim);font-size:12px;line-height:1.55;margin-top:14px}
</style></head>
<body><div class="wrap">
  <h1>🚗 Tesla FSD (Supervised) — Cumulative Miles Are Accelerating</h1>
  <div class="sub">Cumulative miles driven on Full Self-Driving (Supervised), by milestone date · source: Tesla / FSD trackers, 2025-2026</div>
  <div class="cards" id="cards"></div>
  <h2>Cumulative FSD miles (billions)</h2>
  <div class="bars" id="bars"></div>
  <div class="note" id="note"></div>
</div>
<script>
// cumulative FSD miles (billions) at confirmed milestone dates
const MILE=[["Dec 2025",7],["Feb 2026",8],["Apr 2026",9],["May 2026",10]];
const maxV=11;
document.getElementById("cards").innerHTML=[
 ["10B","cumulative FSD miles (May 2026)"],
 ["~1B / mo","current pace (was ~1B per ~2 mo)"],
 ["~30M","FSD miles driven per DAY now"],
 ["~12%","of Tesla owners use/pay for FSD"],
 ["+89%","annual FSD miles 2024 to 2025 (2.25B to 4.25B)"],
].map(c=>`<div class="card"><div class="n">${c[0]}</div><div class="l">${c[1]}</div></div>`).join("");
document.getElementById("bars").innerHTML=MILE.map(m=>{
 const h=m[1]/maxV*100;
 return `<div class="col"><div class="v">${m[1]}B</div><div class="bar" style="height:${h}%"></div><div class="x">${m[0]}</div></div>`;
}).join("");
document.getElementById("note").innerHTML=
 "<b>Yes, it's growing fast and accelerating.</b> Each new billion miles arrives quicker: 7B to 8B took 53 days, 8B to 9B took 43, 9B to 10B just 31. "+
 "Daily FSD miles roughly doubled in 2026 (~14M/day to ~30M/day). "+
 "On the '% of all miles' question: Tesla does NOT publish that figure. What IS reported: ~12% of owners use FSD, and ~30M FSD miles/day vs an estimated ~200M+ total miles/day across the global Tesla fleet, which works out to a rough ESTIMATE of ~10-15% of Tesla miles being on FSD (in line with the ~12% adoption). Treat the % as an estimate, not a Tesla-published number, the cumulative-miles trend above is the hard data.";
</script></body></html>
