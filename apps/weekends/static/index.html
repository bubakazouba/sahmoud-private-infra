<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekends: did we see people?</title>
<style>
 :root{--bg:#0f1419;--panel:#1a2332;--panel2:#233148;--text:#e8eef4;--muted:#8b9bb4;--accent:#4ea8de;--good:#6ee7b7;--bad:#f87171;--warn:#fbbf24}
 *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
 .wrap{max-width:860px;margin:0 auto;padding:22px 16px 70px}
 h1{font-size:23px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
 .hero{background:var(--panel);border:1px solid var(--panel2);border-radius:14px;padding:18px 20px;margin-bottom:8px;text-align:center}
 .big{font-size:40px;font-weight:800;color:var(--good);line-height:1.1}
 .big small{font-size:17px;color:var(--muted);font-weight:600}
 .heroSub{color:var(--muted);font-size:13.5px;margin-top:6px}
 .bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:12px auto 0;max-width:420px}
 .bar>div{height:100%;background:var(--good);border-radius:5px;transition:width .4s}
 .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0 18px;font-size:13px;color:var(--muted)}
 .controls label{cursor:pointer;user-select:none;background:var(--panel);border:1px solid var(--panel2);border-radius:8px;padding:6px 10px}
 .wk{background:var(--panel);border:1px solid var(--panel2);border-radius:12px;margin-bottom:12px;overflow:hidden}
 .wk.saw{border-color:rgba(110,231,183,.4)}
 .wkhead{display:flex;justify-content:space-between;align-items:center;padding:11px 15px;background:var(--panel2)}
 .wkhead .d{font-weight:700;font-size:15px}
 .wkhead .tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
 .tag.yes{background:rgba(110,231,183,.18);color:var(--good)}
 .tag.no{background:rgba(139,155,180,.15);color:var(--muted)}
 .ev{display:flex;align-items:center;gap:8px;padding:9px 15px;border-top:1px solid var(--panel2);flex-wrap:wrap}
 .ev.counts{background:rgba(110,231,183,.06)}
 .ev .t{flex:1;min-width:140px;font-size:14px}
 .ev .t .cal{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-left:6px}
 .ev.off .t{opacity:.45;text-decoration:line-through}
 .tg{border:1px solid var(--panel2);background:#0f1828;color:var(--muted);border-radius:7px;padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap;font-weight:600}
 .tg.on{color:var(--good);border-color:var(--good);background:rgba(110,231,183,.12)}
 .tg.no{color:var(--bad);border-color:rgba(248,113,113,.5)}
 .exc{padding:7px 15px;border-top:1px solid var(--panel2)}
 .exc summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none}
 .foot{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.55}
</style></head><body><div class="wrap">
 <h1>🗓️ Did we see people this weekend?</h1>
 <div class="sub">Sahmoud + Preksha · weekends Jan–Jun 2026 · pulled from your + Preksha's + the family calendar. Toggle each event below — the count is yours to calibrate.</div>
 <div class="hero">
   <div class="big" id="count">—</div>
   <div class="heroSub" id="countSub"></div>
   <div class="bar"><div id="barFill" style="width:0"></div></div>
 </div>
 <div class="controls">
   <label><input type="checkbox" id="onlySaw"> only weekends you saw people</label>
   <label><input type="checkbox" id="showExc"> show excluded (chores/classes)</label>
 </div>
 <div id="list"></div>
 <div class="foot" id="foot"></div>
</div>
<script>
let DATA=null, OV={};
const eff=(ev)=>{const o=OV[ev.id]||{};return {happened:o.happened!==undefined?o.happened:true, social:o.social!==undefined?o.social:(ev.default==='social')};};
const counts=(ev)=>{const e=eff(ev);return e.happened&&e.social;};
const sawPeople=(w)=>w.events.some(counts);

async function boot(){
 DATA=await (await fetch("data.json?_="+Date.now())).json();
 try{OV=await (await fetch("api/overrides?_="+Date.now())).json()||{}}catch(e){OV={}}
 render();
}
async function toggle(id,field){
 const ev=findEv(id);const cur=eff(ev);const nv=!cur[field];
 OV[id]=OV[id]||{};OV[id][field]=nv;
 render();
 try{await fetch("api/overrides",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,[field]:nv})});}
 catch(e){/* keep local */}
}
function findEv(id){for(const w of DATA.weekends)for(const e of w.events)if(e.id===id)return e;}
function render(){
 const total=DATA.weekends.length;
 const saw=DATA.weekends.filter(sawPeople).length;
 document.getElementById('count').innerHTML=saw+' <small>/ '+total+' weekends</small>';
 document.getElementById('countSub').textContent='you saw people on '+Math.round(saw/total*100)+'% of weekends ('+saw+' of '+total+')';
 document.getElementById('barFill').style.width=(saw/total*100)+'%';
 const onlySaw=document.getElementById('onlySaw').checked, showExc=document.getElementById('showExc').checked;
 const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
 let html='';
 for(const w of DATA.weekends){
  const did=sawPeople(w);
  if(onlySaw&&!did)continue;
  const main=w.events.filter(e=>e.default!=='excluded');
  const exc=w.events.filter(e=>e.default==='excluded');
  html+='<div class="wk'+(did?' saw':'')+'">';
  html+='<div class="wkhead"><span class="d">'+esc(w.label)+'</span><span class="tag '+(did?'yes':'no')+'">'+(did?'✓ saw people':'no')+'</span></div>';
  for(const ev of main){
   const e=eff(ev);const c=counts(ev);
   html+='<div class="ev'+(c?' counts':'')+(e.happened?'':' off')+'">'
     +'<span class="t">'+esc(ev.title)+'<span class="cal">'+esc(ev.wd)+' · '+esc(ev.cal)+'</span></span>'
     +'<button class="tg '+(e.happened?'on':'no')+'" onclick="toggle(\''+ev.id.replace(/'/g,"\\'")+'\',\'happened\')">'+(e.happened?'✓ happened':'✗ didn\'t')+'</button>'
     +'<button class="tg '+(e.social?'on':'')+'" onclick="toggle(\''+ev.id.replace(/'/g,"\\'")+'\',\'social\')">'+(e.social?'👥 social':'– not social')+'</button>'
     +'</div>';
  }
  if(exc.length){
   if(showExc){html+='<div class="exc"><div style="color:var(--muted);font-size:12px;margin-bottom:4px">excluded (chores/classes/logistics):</div>';
     for(const ev of exc)html+='<div style="font-size:13px;color:var(--muted);padding:2px 0">· '+esc(ev.title)+' <span style="opacity:.6">('+esc(ev.wd)+')</span></div>';
     html+='</div>';}
   else html+='<div class="exc"><summary onclick="this.parentElement.outerHTML=\'\';">+ '+exc.length+' excluded (chores/classes) hidden</summary></div>';
  }
  html+='</div>';
 }
 document.getElementById('list').innerHTML=html||'<div style="color:var(--muted);text-align:center;padding:30px">no weekends match</div>';
 document.getElementById('foot').innerHTML='Generated '+esc((DATA.generated||'').replace('T',' ').slice(0,16))+'. "Saw people" = an event that <b>happened</b> AND was <b>social</b> (seeing friends/family/parties, not just you two). Defaults are my best guess; your toggles are saved and override them. The weekly Family Call, classes/seminars, chores and just-you-two dates are excluded by default — flip any of them if you disagree.';
}
["onlySaw","showExc"].forEach(id=>document.getElementById(id).addEventListener('change',render));
boot().catch(e=>document.getElementById('list').innerHTML='<div style="color:#f87171">Failed: '+e.message+'</div>');
</script></body></html>
