<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LA Parking Citations Heatmap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; background: #0b1320; color: #e6ecff; }
#wrap { display: flex; flex-direction: column; height: 100vh; }
header { padding: 12px 16px; background: #15203a; border-bottom: 1px solid #23304f; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 18px; font-weight: 600; }
.meta { color: #8893b8; font-size: 12px; }
#controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
select, button { background: #0b1320; border: 1px solid #23304f; color: #e6ecff; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
select:focus { outline: none; border-color: #7aa2f7; }
#map { flex: 1; min-height: 0; background: #15203a; }
.legend { background: rgba(15,22,42,0.92); padding: 10px 12px; border-radius: 6px; color: #e6ecff; font-size: 12px; line-height: 1.5; border: 1px solid #23304f; }
.legend .grad { display: flex; height: 8px; margin: 4px 0; border-radius: 4px; background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000); }
.legend .lab { display: flex; justify-content: space-between; color: #8893b8; font-size: 10px; }
@media (max-width: 600px) {
  header { padding: 8px 10px; gap: 6px; }
  h1 { font-size: 14px; }
  .meta { font-size: 10px; }
  #controls { margin-left: 0; width: 100%; }
  select, button { font-size: 11px; padding: 4px 8px; }
}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div>
      <h1>🅿️ LA Parking Citations</h1>
      <div class="meta" id="meta">loading…</div>
    </div>
    <div id="controls">
      <label style="font-size:12px;color:#8893b8;">violation:</label>
      <select id="vio-select"><option value="">all (heatmap)</option></select>
      <button id="reset-view">⌖ reset view</button>
    </div>
  </header>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
const LA_CENTER = [34.05, -118.30];
const map = L.map('map', { preferCanvas: true }).setView(LA_CENTER, 11);

// Dark basemap (CartoDB Dark Matter)
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> © <a href="https://carto.com/">CARTO</a> · Citations: data.lacity.org',
  subdomains: 'abcd', maxZoom: 19,
}).addTo(map);

let heatLayer = null;
let DATA = null;

// Custom legend
const legend = L.control({ position: 'bottomright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<div><strong>citation density</strong></div><div class="grad"></div><div class="lab"><span>low</span><span>high</span></div>';
  return div;
};
legend.addTo(map);

document.getElementById('reset-view').addEventListener('click', () => map.setView(LA_CENTER, 11));

function renderHeat(points) {
  if (heatLayer) map.removeLayer(heatLayer);
  const z = map.getZoom();
  // Scale radius with zoom — tight dots at high zoom, slightly larger at low zoom
  const radius = z >= 15 ? 4 : z >= 13 ? 5 : z >= 11 ? 6 : 8;
  const blur = z >= 15 ? 5 : z >= 13 ? 7 : z >= 11 ? 9 : 12;
  heatLayer = L.heatLayer(points, {
    radius, blur, maxZoom: 18, max: 3.5, minOpacity: 0.35,
    gradient: { 0.15: '#1a3a82', 0.3: '#00aaff', 0.5: '#00ff88', 0.7: '#ffee00', 0.85: '#ff7700', 1.0: '#ff0033' },
  }).addTo(map);
}
// Re-render on zoom so radius adapts
map.on('zoomend', () => {
  const v = document.getElementById('vio-select').value;
  const pts = (!v ? DATA?.all_points : DATA?.by_violation[v]) || [];
  if (pts.length) renderHeat(pts);
});

fetch('heatmap.json?v=' + Date.now()).then(r => r.json()).then(d => {
  DATA = d;
  document.getElementById('meta').textContent =
    `${d.count.toLocaleString()} citations · ${d.date_min || '?'} → ${d.date_max || '?'} · pulled from data.lacity.org`;

  // Populate violation dropdown
  const sel = document.getElementById('vio-select');
  d.top_violations.forEach(v => {
    if (!v.name) return;
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.count.toLocaleString()})`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => {
    const v = sel.value;
    if (!v) renderHeat(d.all_points);
    else if (d.by_violation[v]) renderHeat(d.by_violation[v]);
  });

  // Initial render — all points
  renderHeat(d.all_points);
});
</script>
</body>
</html>
